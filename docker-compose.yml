services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: ${APPLYFLOW_DATABASE_PASSWORD:?Set APPLYFLOW_DATABASE_PASSWORD in the root .env file}
      POSTGRES_DB: applyflow_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "applyflow", "-d", "applyflow_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["ruby", "./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8000}
      APP_ALLOWED_HOSTS: "${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      APPLYFLOW_DATABASE_PASSWORD: ${APPLYFLOW_DATABASE_PASSWORD:?Set APPLYFLOW_DATABASE_PASSWORD in the root .env file}
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && node dev.mjs"]
    environment:
      FRONTEND_ALLOWED_HOSTS: "${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  frontend_node_modules:
